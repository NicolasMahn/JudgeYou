<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Share links open this page at /v/<id>; relative paths must still mean the site root. -->
    <base href="/" />
    <title>JudgeYou · A field guide to the people in your chats</title>
    <meta name="description" content="Paste a chat or its screenshots. Everyone in it is classified into one of twelve species, and pairs into one of eight duos." />
    <link rel="icon" href="img/types/drama_llama.webp" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="img/icon-192.png" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <strong>JudgeYou</strong>
      <span data-i18n="tagline">A field guide to the people in your chats</span>
      <span data-i18n="volume">Vol. I · 2026</span>
      <select id="language" data-i18n-attr="aria-label: language"></select>
    </header>

    <main>
      <section class="hero">
        <h1 data-i18n-html="hero">Who is the <em>problem</em> in your chat?</h1>
        <p class="lede" data-i18n="lede"></p>
      </section>

      <div class="species-strip" aria-hidden="true">
        <div id="species-track" class="species-track"></div>
      </div>

      <section id="intake" class="intake">
        <div class="intake-label"><b data-i18n="exhibit">Exhibit A</b><span data-i18n="evidence">The evidence</span></div>
        <div>
          <div class="chat-box">
            <textarea
              id="chat"
              spellcheck="false"
              data-i18n-attr="aria-label: chatLabel; placeholder: chatPlaceholder"
            ></textarea>
            <button id="clear" class="clear" type="button" hidden data-i18n="clear"></button>
          </div>
          <div id="shots" class="shots" hidden>
            <ol id="shot-list" class="shot-list"></ol>
          </div>
          <div id="subjects" class="subjects" aria-live="polite"></div>
          <div class="intake-bar">
            <!-- Separate pickers: images alone open the phone's photo picker, with
                 the newest screenshots first; mixed with exports, Android only
                 offers "Camera" and "Files". -->
            <button id="open-shots" class="secondary" type="button">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2" /><path d="M10.5 18.5h3" /></svg>
              <span data-i18n="openShots"></span>
            </button>
            <input id="shot-file" type="file" multiple hidden accept="image/*" />
            <input
              id="file"
              type="file"
              hidden
              accept=".txt,.zip,.json,.html,.htm,.csv,.tsv,text/plain,application/zip,application/json,text/html,text/csv"
            />
            <!-- Exports mostly arrive through the share menu or a drop; the button
                 stays for the few who saved one as a file. -->
            <div class="quiet-links">
              <button id="open-file" class="link quiet" type="button" data-i18n="openFile"></button>
              <button id="sample" class="link" type="button" data-i18n="sample"></button>
            </div>
            <div class="verdict">
              <label class="pledge">
                <input id="consent" type="checkbox" />
                <span data-i18n-html="consent"></span>
              </label>
              <button id="judge" class="primary" type="button" disabled data-i18n="judge"></button>
            </div>
          </div>
          <form id="names-form" class="names-form" hidden>
            <label for="names" data-i18n="namesLabel"></label>
            <input id="names" autocomplete="off" data-i18n-attr="placeholder: namesPlaceholder" />
            <button type="submit" data-i18n="namesSubmit"></button>
          </form>
          <button id="install" class="link install" type="button" hidden data-i18n="install"></button>
          <p id="error" class="error" role="alert" hidden></p>
        </div>
      </section>

      <section id="lab" class="lab" aria-live="polite" hidden>
        <img id="lab-specimen" alt="" width="112" height="112" />
        <div id="lab-log" class="lab-log"></div>
      </section>

      <section id="results" class="results" aria-live="polite" hidden>
        <!-- The prime suspect, or for two people the duo: both mascots, one verdict. -->
        <article id="suspect" class="suspect">
          <div class="suspect-figure">
            <img id="suspect-mascot" alt="" width="192" height="192" />
            <img id="duo-mascot" alt="" width="192" height="192" hidden />
          </div>
          <div>
            <p id="suspect-kicker" class="kicker"></p>
            <p id="suspect-name" class="suspect-name"></p>
            <p id="suspect-stat" class="suspect-stat"></p>
            <p id="suspect-note" class="suspect-note" hidden></p>
          </div>
          <div id="suspect-bars" class="bars"></div>
          <div id="suspect-stamp" class="stamp"></div>
        </article>
        <div class="verdict-actions">
          <button id="share" class="primary" type="button" data-i18n="share"></button>
          <button id="own-chat" class="secondary" type="button" hidden data-i18n="ownChat"></button>
        </div>
        <div id="records" class="records"></div>
        <div id="plates" class="plates"></div>
      </section>
    </main>

    <footer class="colophon">
      <span data-i18n="colophon"></span>
      <nav class="colophon-links">
        <a href="impressum.html" data-i18n="imprint"></a>
        <a href="privacy.html" data-i18n="privacy"></a>
      </nav>
      <!-- With the legal links: there when needed, not advertised. -->
      <p id="kept" class="kept" hidden>
        <span id="kept-text"></span> <button id="forget" class="link" type="button" data-i18n="forget"></button>
      </p>
    </footer>

    <dialog id="card-dialog" class="card-dialog">
      <canvas id="card-canvas" width="1080" height="1350"></canvas>
      <form method="dialog" class="card-controls">
        <fieldset>
          <legend data-i18n="cardNames"></legend>
          <div id="card-names" class="card-names"></div>
        </fieldset>
        <button id="card-share" class="primary" type="button" data-i18n="cardShare"></button>
        <button id="card-copy" class="secondary" type="button" data-i18n="cardCopy"></button>
        <button id="card-download" class="secondary" type="button" data-i18n="cardDownload"></button>
        <button class="link" value="close" data-i18n="cardClose"></button>
      </form>
    </dialog>

    <template id="bar-row">
      <div class="bar-row">
        <span class="who"></span>
        <div class="track"><div class="fill"></div></div>
        <span class="value"></span>
      </div>
    </template>

    <template id="plate">
      <article class="plate">
        <div class="plate-head">
          <span class="plate-no"></span>
          <span class="menace"><span class="menace-value">0</span><span class="menace-label"></span></span>
        </div>
        <div class="plate-figure"><img alt="" width="240" height="240" /><div class="stamp"></div></div>
        <h2 class="plate-name"></h2>
        <p class="plate-type"></p>
        <p class="plate-species"></p>
        <p class="plate-note"></p>
        <div class="measures"></div>
        <dl class="counted"></dl>
        <dl class="findings"></dl>
      </article>
    </template>

    <template id="scale">
      <div class="scale">
        <div class="scale-top"><span class="scale-name"></span><span class="scale-confidence"></span></div>
        <div class="track" tabindex="0"><div class="fill"></div></div>
        <div class="scale-level"></div>
      </div>
    </template>

    <template id="finding">
      <div class="finding"><dt></dt><dd></dd></div>
    </template>
  </body>
</html>
