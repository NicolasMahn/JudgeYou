<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JudgeYou</title>
    <meta name="description" content="Pseudo-scientific character assessment for group chats, powered by Jev." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@800;900&display=swap"
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <div class="blob"></div>
      <div class="blob"></div>
      <div class="blob"></div>
    </div>

    <main>
      <header class="hero">
        <p class="kicker">Institute for Applied Chat Forensics</p>
        <h1>Judge<span>You</span></h1>
        <p class="lede">
          Paste a group chat. Jev, a model that answers in calibrated probabilities instead of
          words, measures everyone in it.
        </p>
      </header>

      <section class="panel intake">
        <textarea
          id="chat"
          spellcheck="false"
          aria-label="Chat transcript"
          placeholder="Paste a chat here, or drop a WhatsApp export (.txt).&#10;&#10;One message per line works too:&#10;Ana: are you coming tonight?&#10;Ben: k"
        ></textarea>
        <div class="intake-bar">
          <div id="subjects" class="subjects" aria-live="polite"></div>
          <button id="sample" type="button">Try a sample chat</button>
          <button id="judge" class="primary" type="button" disabled>Judge them</button>
        </div>
        <p class="fineprint">
          The chat goes to OpenRouter and TypeSafe for analysis. This page stores nothing.
        </p>
        <form id="key-form" class="key-form" hidden>
          <input
            id="key"
            type="password"
            autocomplete="off"
            required
            placeholder="Your OpenRouter key (sk-or-…), kept in this browser only"
            aria-label="OpenRouter API key"
          />
          <button type="submit">Save and judge</button>
        </form>
        <p id="error" class="error" role="alert" hidden></p>
      </section>

      <section id="lab" class="panel lab" aria-live="polite" hidden></section>

      <section id="results" class="results" aria-live="polite" hidden>
        <div class="panel culprit">
          <div>
            <p class="culprit-lead">Primary source of drama</p>
            <p id="culprit-name" class="culprit-name"></p>
            <p id="culprit-stat" class="culprit-stat"></p>
          </div>
          <div id="culprit-bars" class="bars"></div>
        </div>
        <div id="cards" class="cards"></div>
        <p id="footnote" class="footnote"></p>
      </section>
    </main>

    <template id="bar-row">
      <div class="bar-row">
        <span class="who"></span>
        <div class="track" tabindex="0"><div class="fill"></div></div>
        <span class="value"></span>
      </div>
    </template>

    <template id="card">
      <article class="panel card">
        <div class="card-head">
          <div>
            <h2 class="name"></h2>
            <p class="archetype"><span class="archetype-name"></span><span class="species"></span></p>
          </div>
          <div class="menace">
            <span class="menace-value">0</span>
            <span class="menace-label">Menace Index</span>
            <div class="severity"></div>
          </div>
        </div>
        <div class="traits"></div>
        <dl class="findings"></dl>
      </article>
    </template>

    <template id="trait">
      <div>
        <div class="trait-top"><span class="trait-name"></span><span class="trait-confidence"></span></div>
        <div class="track" tabindex="0"><div class="fill"></div></div>
        <div class="trait-level"></div>
      </div>
    </template>

    <template id="finding">
      <div class="finding"><dt></dt><dd></dd></div>
    </template>
  </body>
</html>
