<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JudgeYou · Limits</title>
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <script type="module" src="/js/admin.js"></script>
  </head>
  <body>
    <main>
      <a href="/">JudgeYou</a>
      <form id="login">
        <label>Admin token <input id="token" type="password" autocomplete="current-password" required /></label>
        <button>Connect</button>
      </form>
      <p id="status" role="status"></p>
      <form id="settings" hidden>
        <p id="usage"></p>
        <fieldset data-kind="decisions">
          <legend>Judgments</legend>
          <label><span>Per visitor, per hour<small>Judgments one IP address may start each hour, so one person cannot use up the day.</small></span> <input name="perIpPerHour" type="number" min="0" max="100000" required /></label>
          <label><span>All visitors, per day<small>Total judgments across everyone in 24 hours. This is the spending cap.</small></span> <input name="perDay" type="number" min="0" max="1000000" required /></label>
          <label><span>Running at once<small>Judgments waiting on the model right now. Beyond this, visitors see “busy, try again” instead of a queue.</small></span> <input name="maxConcurrent" type="number" min="1" max="512" required /></label>
        </fieldset>
        <fieldset data-kind="screenshots">
          <legend>Screenshot transcription</legend>
          <label><span>Per visitor, per hour<small>Uploads one IP address may send each hour. One upload counts once, however many screenshots it has.</small></span> <input name="perIpPerHour" type="number" min="0" max="100000" required /></label>
          <label><span>All visitors, per day<small>Total uploads across everyone in 24 hours.</small></span> <input name="perDay" type="number" min="0" max="1000000" required /></label>
          <label><span>Running at once<small>Uploads being read right now. Kept lower than judgments because images are larger and slower.</small></span> <input name="maxConcurrent" type="number" min="1" max="64" required /></label>
        </fieldset>
        <label><span>Timeout in seconds<small>How long to wait for the model before telling the visitor to try again. Applies to both.</small></span> <input id="timeout" type="number" min="1" max="120" step="0.001" required /></label>
        <p>Set an hourly or daily limit to zero to pause new requests. The hour and day count from server start, not from the clock, and a restart resets both.</p>
        <button>Save limits</button>
        <button id="refresh" type="button">Refresh usage</button>
        <button id="disconnect" type="button">Disconnect</button>
      </form>
    </main>
  </body>
</html>
